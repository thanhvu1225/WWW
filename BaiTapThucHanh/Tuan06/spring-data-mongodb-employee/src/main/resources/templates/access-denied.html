<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Từ chối truy cập (403 Forbidden)</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <style>
        .denied-box {
            max-width: 560px;
            margin: 50px auto;
            text-align: center;
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 32px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .denied-code {
            font-size: 54px;
            font-weight: 800;
            color: var(--danger);
            margin-bottom: 8px;
        }
    </style>
</head>
<body>
<header class="topbar">
    <div>
        <p class="eyebrow">SPRING DATA MONGODB · SPRING SECURITY</p>
        <h1>Quản lý nhân viên</h1>
    </div>
    <nav>
        <a th:href="@{/employees}">Nhân viên</a>
    </nav>
</header>

<main class="page">
    <div class="denied-box">
        <div class="denied-code">403</div>
        <h2 style="margin-bottom: 12px; color: #1f2937;">Truy cập bị từ chối!</h2>
        <p style="color: #4b5563; margin-bottom: 24px; font-size: 15px;">
            Tài khoản hiện tại của bạn không đủ quyền hạn (Role) để thực hiện thao tác này theo chính sách bảo mật Spring Security.
        </p>
        <div style="display: flex; gap: 12px; justify-content: center;">
            <a class="button primary" id="btn-back-home" th:href="@{/employees}">Về trang danh sách</a>
            <form th:action="@{/logout}" method="post" style="display: inline;">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button class="button secondary" type="submit">Đổi tài khoản khác</button>
            </form>
        </div>
    </div>
</main>
</body>
</html>
