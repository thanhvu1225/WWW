<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chi tiết nhân viên - Spring Data MongoDB</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <style>
        .user-panel {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
        }
        .user-tag {
            background-color: #e0f2fe;
            color: #0369a1;
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: 600;
        }
    </style>
</head>
<body>
<header class="topbar">
    <div>
        <p class="eyebrow">SPRING DATA MONGODB · SPRING SECURITY</p>
        <h1>Quản lý nhân viên</h1>
    </div>
    <div style="display: flex; align-items: center; gap: 16px;">
        <nav aria-label="Điều hướng chính">
            <a th:href="@{/employees}">Nhân viên</a>
            <a th:href="@{/employees/reports}">Thống kê</a>
        </nav>
        <div class="user-panel" sec:authorize="isAuthenticated()">
            <span>Xin chào, <strong sec:authentication="name"></strong> (<span class="user-tag" th:text="${#authentication.authorities[0].authority.replace('ROLE_', '')}"></span>)</span>
            <form th:action="@{/logout}" method="post" style="display: inline;">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button class="button secondary" style="padding: 4px 10px; font-size: 12px;" type="submit">Đăng xuất</button>
            </form>
        </div>
    </div>
</header>

<main class="page narrow">
    <a class="back" th:href="@{/employees}">← Quay lại danh sách</a>
    <section class="profile-card">
        <div class="avatar" th:text="${#strings.substring(employee.name,0,1)}"></div>
        <div class="profile-heading">
            <p class="muted" th:text="'Mã nhân viên #' + ${employee.id}"></p>
            <h2 th:text="${employee.name}"></h2>
            <span class="tag" th:text="${employee.positionTitle}"></span>
        </div>
        <dl class="detail-grid">
            <div><dt>Vai trò</dt><dd th:text="${employee.role}"></dd></div>
            <div><dt>Tuổi</dt><dd th:text="${employee.age}"></dd></div>
            <div><dt>Phòng ban</dt><dd th:text="${employee.departmentName}"></dd></div>
            <div><dt>Mức lương</dt><dd th:text="${#numbers.formatDecimal(employee.salary,0,'POINT',0,'COMMA')} + ' ₫'"></dd></div>
        </dl>
        <div class="form-actions">
            <!-- Chỉ ADMIN và USER mới được Chỉnh sửa -->
            <a sec:authorize="hasAnyRole('ADMIN', 'USER')" class="button primary" th:href="@{/employees/{id}/edit(id=${employee.id})}">Chỉnh sửa</a>

            <!-- Chỉ ADMIN mới được Xóa -->
            <form sec:authorize="hasRole('ADMIN')" method="post" th:action="@{/employees/{id}/delete(id=${employee.id})}" onsubmit="return confirm('Xóa nhân viên này?')">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button class="button danger" type="submit">Xóa nhân viên</button>
            </form>
        </div>
    </section>
</main>
</body>
</html>
