spring.application.name=spring-data-mongodb-employee
server.port=8084
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/employeewww}
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
